<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #f8fafc;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: #1e293b;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
        }
        .hero {
            text-align: center;
            padding: 4rem 1rem 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        
        /* Styled Link Bar Box */
        .link-bar-container {
            max-width: 600px;
            margin: 2rem auto;
            padding: 1.5rem;
            background-color: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .link-bar-title {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #f8fafc;
        }
        .link-bar-desc {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 1.2rem;
        }
        .link-btn {
            display: inline-block;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            color: #0f172a;
            padding: 0.9rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Frostbyte Site</div>
    </header>

    <main class="hero">
        <h1>Welcome to My Site</h1>
        
        <!-- Styled Link Bar -->
        <div class="link-bar-container">
            <div class="link-bar-title">Access Content</div>
            <p class="link-bar-desc">Click the button below to open the link.</p>
            <a href="https://links.lootlabs.gg/s?VpeESUEG" class="link-btn" target="_blank" rel="noopener noreferrer">
                Open Link
            </a>
        </div>
    </main>

</body>
</html>
